<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELITE PRONOS | Espace Membres Officiel</title>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #d4af37; --dark: #050505; --grey: #121212; --white: #ffffff;
            --safe: #2ecc71; --montante: #3498db; --fun: #e67e22;
        }
        body { font-family: 'Poppins', sans-serif; background-color: var(--dark); color: var(--white); margin: 0; padding: 0; overflow-x: hidden; }

        /* HEADER */
        header { background: rgba(0,0,0,0.95); padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--gold); position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 1.5rem; font-weight: 900; color: var(--gold); text-transform: uppercase; letter-spacing: 3px; cursor: pointer; }
        .nav-right { display: flex; align-items: center; gap: 25px; }

        /* DROPDOWN SPORTS */
        .dropdown { position: relative; display: inline-block; }
        .dropdown-btn { color: white; text-decoration: none; font-weight: 600; font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .dropdown-content { display: none; position: absolute; background-color: #1a1a1a; min-width: 180px; z-index: 10; border: 1px solid var(--gold); right: 0; top: 100%; }
        .dropdown-content a { color: white; padding: 12px 16px; text-decoration: none; display: block; font-size: 0.8rem; }
        .dropdown-content a:hover { background-color: var(--gold); color: black; }
        .dropdown:hover .dropdown-content { display: block; }

        /* MAIN CATEGORIES */
        .main-categories { display: flex; justify-content: center; gap: 25px; padding: 50px 5% 20px 5%; flex-wrap: wrap; }
        .cat-card { width: 180px; padding: 25px 15px; border-radius: 12px; text-align: center; cursor: pointer; transition: 0.3s; border: 2px solid transparent; text-transform: uppercase; font-weight: 900; font-size: 0.9rem; }
        .cat-card.safe { border-color: var(--safe); color: var(--safe); }
        .cat-card.montante { border-color: var(--montante); color: var(--montante); }
        .cat-card.fun { border-color: var(--fun); color: var(--fun); }
        .cat-card:hover { transform: translateY(-5px); background: rgba(255,255,255,0.05); }

        /* DASHBOARD */
        #dashboard { display: none; padding: 30px 5%; }
        .prono-card { background: var(--grey); border-left: 5px solid var(--gold); padding: 25px; margin: 15px auto; max-width: 700px; border-radius: 10px; position: relative; }
        .badge-tag { position: absolute; top: 10px; right: 20px; font-size: 0.7rem; color: var(--gold); border: 1px solid var(--gold); padding: 3px 10px; border-radius: 10px; text-transform: uppercase; }

        /* ÉCRAN OFFRES (PACKS) */
        .waiting-screen { text-align: center; padding: 40px 5%; max-width: 900px; margin: 0 auto; }
        .packs-container { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin-top: 30px; }
        .pack-card { background: var(--grey); border: 1px solid var(--gold); border-radius: 15px; width: 280px; padding: 30px 20px; text-align: center; position: relative; }
        .pack-card h3 { color: var(--white); font-weight: 900; font-size: 1.4rem; margin-bottom: 10px; text-transform: uppercase; }
        .pack-card .price { font-size: 2rem; color: var(--gold); font-weight: 900; margin-bottom: 20px; }
        .pack-card ul { list-style: none; padding: 0; text-align: left; margin-bottom: 25px; min-height: 180px; }
        .pack-card ul li { margin-bottom: 12px; font-size: 0.9rem; display: flex; align-items: center; gap: 10px; color: #ccc; }
        .pack-card ul li i { color: var(--gold); font-size: 0.8rem; }
        
        .btn-subscribe { background: var(--gold); color: black; border: none; padding: 12px 30px; border-radius: 25px; font-weight: 900; text-transform: uppercase; cursor: pointer; width: 100%; transition: 0.3s; }
        .btn-subscribe:hover { transform: scale(1.05); background: white; }

        footer { text-align: center; padding: 40px; color: #444; font-size: 0.75rem; border-top: 1px solid #111; margin-top: 50px; }
    </style>
</head>
<body>

<header>
    <div class="logo" onclick="location.reload()">Elite Pronos</div>
    <div class="nav-right">
        <div class="dropdown" id="sports-menu" style="display:none;">
            <div class="dropdown-btn">NOS SPORTS <i class="fas fa-chevron-down"></i></div>
            <div class="dropdown-content">
                <a onclick="filterProno('foot')">Football ⚽</a>
                <a onclick="filterProno('tennis')">Tennis 🎾</a>
                <a onclick="filterProno('basket')">Basket 🏀</a>
                <a onclick="filterProno('badminton')">Badminton 🏸</a>
                <a onclick="filterProno('pingpong')">Tennis de Table 🏓</a>
            </div>
        </div>
        <div id="auth-status"></div>
    </div>
</header>

<main>
    <div id="private-view" style="display:none;">
        <div class="main-categories">
            <div class="cat-card safe" onclick="filterProno('safe')"><i class="fas fa-shield-check"></i>SAFE 🟢</div>
            <div class="cat-card montante" onclick="filterProno('montante')"><i class="fas fa-chart-line-up"></i>MONTANTE 🔵</div>
            <div class="cat-card fun" onclick="filterProno('fun')"><i class="fas fa-bolt"></i>FUN 🟠</div>
        </div>

        <div id="dashboard">
            <h2 id="current-cat-title" style="text-align:center; color:var(--gold); margin-bottom:30px; text-transform:uppercase;"></h2>
            <div id="pronoContainer">
                <div class="prono-card" data-type="foot safe">
                    <div class="badge-tag">Football</div>
                    <h3>Ligue 1 : PSG - Marseille</h3>
                    <p>Prono : <strong>Victoire PSG @1.55</strong></p>
                </div>
            </div>
            <div id="noProno" style="display:none; text-align:center; padding:50px; color:#555;">Bientôt de nouveaux pronos ici...</div>
        </div>

        <div id="waiting-msg" class="waiting-screen">
            <i class="fas fa-unlock-alt" style="font-size:2.5rem; color:var(--gold); margin-bottom:15px;"></i>
            <h2 style="font-weight:900;">
